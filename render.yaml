# Render Blueprint — New → Blueprint → pick this repo. Deploys the face-search API.
services:
  - type: web
    name: pcr-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Persistent disks need a paid plan. On "free" the photo archive and index
    # are wiped on every deploy/restart — see README before downgrading.
    plan: starter
    region: singapore          # closest Render region to Mumbai
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /api/health
    disk:
      name: pcr-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PCR_ALLOWED_ORIGINS
        value: https://pcr-landing-page-alpha.vercel.app,http://localhost:5173
      - key: PCR_ADMIN_TOKEN
        generateValue: true    # copy it from the Render dashboard → Environment
      - key: PCR_PHOTOS_DIR
        value: /data/photos
      - key: PCR_DB_PATH
        value: /data/pcr.db
